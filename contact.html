<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Wards Collection</title><meta name="description" content="Contact Wards Collection for general, wholesale and manufacturing enquiries."><link rel="canonical" href="https://ahuis2580-svg.github.io/wards-collection/contact.html"><link rel="stylesheet" href="styles.css"></head><body><header data-site-header></header><main><section class="pagehero"><span class="eyebrow">Contact</span><h1>Contact Wards</h1></section><section class="section"><div class="contact-grid"><div><h2>Email us</h2><p><a class="contact-link" href="mailto:wardsugc@gmail.com">wardsugc@gmail.com</a></p><p>For collection, wholesale and manufacturing enquiries, complete the form or email us directly.</p></div><form id="contactForm"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Enquiry<select name="subject"><option>General enquiry</option><option>Wholesale</option><option>Manufacturing</option><option>Product availability</option></select></label><label>Message<textarea name="message" rows="7" required></textarea></label><button class="btn dark" type="submit">Send enquiry</button><small class="contact-note" id="contactNote">The form prepares an email in your email application. It does not send or store messages on a server.</small></form></div></section></main><footer data-site-footer></footer><div id="bagRoot"></div><script src="app.js"></script></body></html>
